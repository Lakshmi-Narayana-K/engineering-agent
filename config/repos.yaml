# Product repositories exposed to the investigation workspace.
#
# These are existing local checkouts. They were NOT cloned by this POC and must
# not be modified by it. `repos/<name>` is a symlink to `local_path`.
#
# `baseline` records the Git state captured at POC setup time. It is what
# scripts/verify-product-repos-untouched.sh compares against. Every repo was
# already dirty at capture; the check asserts "no new changes", not "clean".
#
# The bash-side list lives in scripts/_common.sh (REPOS and REPO_SOURCES), which
# bootstrap, the clean export and the baseline check all read. This file is the
# human-facing manifest: what each repository is, where its documentation lives,
# and what state it was in when it was linked.

version: 1

repositories:
  - name: nkb_backend
    local_path: /home/nxtwave/Desktop/CodeBase-HUB/nkb_backend
    link: repos/nkb_backend
    access: read-only
    remote: ssh://git-codecommit.ap-south-1.amazonaws.com/v1/repos/nkb_backend
    baseline:
      branch: ccbp_beta
      head: 940bafbb09a47c0daac45aea8c0c173b63108ab9
      dirty_entries: 12
