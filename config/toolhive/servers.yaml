# Which MCP servers exist, and exactly which tools each may expose.
#
# This file replaces the mcp.allowedServers and mcp.gatedTools blocks in
# config/acp-permissions.json. The difference is not the syntax, it is who
# enforces it. Those blocks were checked by our own shim while relaying an ACP
# permission request, which only worked because Cursor chose to ask. ToolHive
# enforces this list in the MCP request path itself: a tool absent from `tools`
# is filtered out of tools/list AND refused at tools/call, whether or not
# anything asked permission first.
#
# Verified on ToolHive v0.44.0 against a 5-tool server with 2 allowlisted:
# tools/list returned 2, and calls to the other 3 failed with "tool not found".
#
# Default-deny is a property of the format: `tools` is an explicit list, and
# ToolHive validates every name against what the server actually advertises, so
# a typo fails at startup rather than silently exposing nothing - or worse,
# silently exposing everything.
#
# Read by scripts/toolhive-up.sh. Tested by tests/security/run-toolhive-tests.sh.

# --- how the gateway is reached ----------------------------------------------
#
# The proxy binds to loopback on the host. Two reasons, one of them discovered
# the hard way:
#
#   1. Section 29 of the migration plan forbids exposing the gateway on
#      0.0.0.0, and loopback is the narrowest option.
#   2. ToolHive v0.44.0 binds where --host says but health-checks localhost, so
#      a non-loopback bind never reaches "running" - the workload sits in
#      "starting" forever even though the proxy is serving. Loopback is the only
#      bind where readiness works.
#
# The agent sandbox is a container, so it cannot reach host loopback directly.
# It resolves the gateway through host.docker.internal, which requires
# --add-host=host.docker.internal:host-gateway on the sandbox. Verified working:
# the sandbox gets an HTTP response from the gateway.

gateway:
  bind: 127.0.0.1
  sandbox_hostname: host.docker.internal
  audit: enabled            # --enable-audit
  network_isolation: true   # --isolate-network, ToolHive's default

# --- known limitation, recorded rather than worked around ---------------------
#
# With no OIDC provider configured, ToolHive logs: "the proxy will accept every
# request unauthenticated and assign each a synthetic local-user identity with
# no token or credential check". Audit records therefore carry
# subjects.user_id = "nxtwave", which is a label, not an authenticated identity.
#
# The consequence: Cedar authorization policies cannot make per-user decisions
# locally, because there is no real principal to decide about. Tool filtering
# still works - it is not identity-dependent - so tool admission is genuinely
# enforced while user-level authorization waits for an identity provider.
#
# This is acceptable locally, where the only caller is the developer's own
# sandbox reached over loopback. It is NOT acceptable for a shared deployment,
# and is a prerequisite for it.

authorization:
  identity: SYNTHETIC - no OIDC configured
  cedar_policies: DEFERRED - require a real principal to be meaningful
  enforced_today: tool admission via allowlist
  required_for_deployment: OIDC provider, then Cedar policies

# --- servers -----------------------------------------------------------------

servers:

  # Live and working. No credentials, so it is also the safest server to use as
  # the gateway's own regression fixture.
  - name: aws-documentation
    enabled: false
    registry: aws-documentation
    proxy_port: 19103
    purpose: AWS service behaviour and quota lookups during investigation
    disabled_because: >
      Redundant once aws-api is live: the managed AWS MCP Server exposes
      search_documentation and read_documentation itself. AWS specifically warns
      that running overlapping servers creates duplicate tool names that
      confuse agents and waste prompt tokens, so one source of documentation
      tools is better than two. Kept here, disabled, because it needs no
      credentials and is therefore a useful fixture if the AWS path breaks.
    tools:
      - search_documentation
      - read_documentation
    excluded:
      # Not dangerous, but not needed either, and every exposed tool is surface
      # area plus tokens spent on its description in the prompt.
      - read_sections
      - recommend
      - search_table

  # Live. The managed AWS MCP Server, reached through the official local proxy.
  #
  # Migrated off awslabs.aws-api-mcp-server, which hit end of development on
  # 15 July 2026 and is removed on 15 July 2027. It depends on AWS CLI v1, also
  # in maintenance mode, so it would have stopped covering new AWS APIs. The
  # replacement is a fully managed remote server; the only local component is a
  # thin proxy that converts SigV4 to the OAuth 2.1 the endpoint expects.
  #
  # Boundary note that drove the allowlist: this server takes the operation as
  # an ARGUMENT, so ecs:DescribeServices and ecs:DeleteService are the same tool
  # name. Tool filtering cannot separate them and must not be expected to. IAM
  # refuses the second one, verified through this exact path - a delete-service
  # and an iam create-user both returned AccessDenied with "explicit deny",
  # while ecs list-clusters returned real clusters.
  - name: aws-api
    enabled: true
    protocol: "uvx://mcp-proxy-for-aws@1.6.4"
    endpoint: https://aws-mcp.us-east-1.api.aws/mcp
    proxy_port: 19106
    transport: stdio
    region: ap-south-1
    purpose: read-only AWS and CloudWatch investigation
    authorization_boundary: IAM, not ToolHive

    # Credentials are injected via ToolHive's environment secrets provider
    # rather than a mounted file. Not a preference: ToolHive drives its own
    # Docker socket and ignores DOCKER_HOST, and on this machine that daemon
    # cannot see the repository path, so a bind mount silently produced an
    # empty directory and the proxy exited with "profile could not be found".
    # Secret injection avoids needing a shared filesystem at all, and keeps the
    # credential in the one component that needs it.
    credentials: toolhive environment secrets provider, profile nkb-agent-alpha

    tools:
      - aws___run_script          # replaced aws___call_aws upstream; gated read-only in acp-policy-proxy
      - aws___get_tasks           # poll long-running calls
      - aws___list_regions
      - aws___search_documentation
      - aws___read_documentation

    excluded:
      # Generates pre-signed S3 URLs for upload as well as download: a write
      # path and a data-egress path in one tool. Our IAM policy grants no S3
      # permissions so it would fail anyway, which makes excluding it free.
      - aws___get_presigned_url

      # Not needed, and every exposed tool costs prompt tokens for its
      # description.
      - aws___retrieve_skill
      - aws___get_regional_availability

  # Phase 8. Currently a local checkout spawned directly by Cursor, which means
  # no container, no network isolation and no audit. Moving it behind the
  # gateway gets all three.
  #
  # Every tool needs individual review: names containing investigate, report,
  # search or analyze do not imply read-only.
  - name: rapid7-insightidr
    # Enabled after tests/security/run-rapid7-tests.sh passed 14/14 against a
    # running instance, recorded in
    # evaluations/migration-baseline/rapid7-admission.json. The checks that
    # justify the flag are the tools/call refusals: investigate_alerts,
    # bulk_close_investigations and delete_log are refused by the gateway, not
    # merely hidden from tools/list.
    #
    # It was added disabled and started for verification with
    # NKB_TOOLHIVE_ONLY=rapid7-insightidr, so it was never exposed to the agent
    # before those tests passed.
    enabled: true
    image: nkb-rapid7-mcp:0.1.0
    proxy_port: 19107
    transport: stdio
    region: eu
    purpose: security investigation lookups
    authorization_boundary: >
      ToolHive tool admission, plus the scope of the Rapid7 API key itself.
      Unlike AWS there is no IAM-equivalent we control from here, so the key
      must be created read-only in the Rapid7 console - see prerequisites.
    credentials: toolhive environment secrets provider, INSIGHTIDR_API_KEY

    # Built from a local checkout rather than a registry: the project is not
    # published to PyPI, so there is no uvx:// scheme for ToolHive to resolve.
    #   DOCKER_HOST=unix:///var/run/docker.sock docker build \
    #     -f docker/rapid7-mcp/Dockerfile -t nkb-rapid7-mcp:0.1.0 \
    #     runtime/mcp/r7-insightidr
    # The DOCKER_HOST is not optional: ToolHive uses the system daemon, so an
    # image built under the desktop-linux context is invisible to it.
    build: docker/rapid7-mcp/Dockerfile

    # The allowlist is DERIVED, not hand-written: every entry below carries
    # readOnlyHint=True in the upstream source. That method matters here more
    # than anywhere else in this file, because the server has 97 tools of which
    # 22 carry no annotation at all - and all 22 mutate. Selecting by name would
    # have admitted investigate_alerts and generate_alert_report, both of which
    # write despite reading as read-only.
    #
    # 55 of the 64 read-only tools are exposed. The other 9 are omitted as
    # unnecessary for investigation; each exposed tool costs prompt tokens.
    #
    # tests/security/run-rapid7-tests.sh re-derives this from source and fails
    # if any exposed tool is not annotated read-only upstream.
    tools:
      - get_account
      - get_alert
      - get_alert_action_result
      - get_alert_action_tasks
      - get_alert_actions
      - get_alert_actors
      - get_alert_evidences
      - get_alert_field
      - get_alert_field_values
      - get_alert_fields
      - get_alert_process_tree
      - get_alert_process_trees
      - get_alerts_by_rrn
      - get_asset
      - get_audit_log
      - get_audit_search_results
      - get_comment
      - get_detection_rule
      - get_detection_rule_counts
      - get_investigation
      - get_leql_variable
      - get_local_account
      - get_log
      - get_log_event_sources
      - get_log_search_results
      - get_log_topkeys
      - get_logset
      - get_next_log_search_page
      - get_rule_exception
      - get_saved_query
      - get_search_stats
      - get_user
      - list_audit_logs
      - list_audit_query_endpoints
      - list_detection_rules
      - list_investigation_alerts
      - list_investigation_comments
      - list_investigation_rapid7_product_alerts
      - list_investigations
      - list_leql_variables
      - list_logs
      - list_logsets
      - list_rule_exceptions
      - list_rule_exceptions_for_rule
      - list_saved_queries
      - run_log_search
      - run_saved_query
      - search_accounts
      - search_alerts
      - search_assets
      - search_detection_rules
      - search_local_accounts
      - search_users
      - start_audit_log_search
      - start_log_search

    excluded:
      # All 11 tools annotated destructive, and all 22 unannotated mutating
      # tools, are excluded by construction rather than by enumeration - the
      # allowlist is a subset of the read-only set, so nothing else can appear.
      # Named here are the ones whose names would otherwise invite exposure:
      - investigate_alerts        # unannotated; creates an investigation
      - generate_alert_report     # unannotated; writes a report artefact
      - bulk_close_investigations # annotated destructive
      - update_alert
      - update_alerts
      - set_investigation_status
      - add_investigation_comment
      - create_detection_rule
      - delete_detection_rule
      - delete_log
      - delete_logset

  # Read-only Google Sheets access, added 2026-09-02.
  #
  # Added disabled, per the rule at the top of this file: a new server is
  # started explicitly with NKB_TOOLHIVE_ONLY=google-sheets, tested, and only
  # then flipped. Nothing about this one earns an exception.
  #
  # Why THIS server, since the obvious choice was the other one. The first
  # attempt was uvx://mcp-google-sheets@0.6.3, the only Sheets server on PyPI.
  # It does not run: it imports mcp.server.fastmcp, its dependency range does not
  # cap mcp below 2.x, and FastMCP was renamed in mcp 2.0. The container starts,
  # the import fails, ToolHive reports "ready" because the proxy is up, and the
  # workload then crash-loops. `uvx --with "mcp<2"` fixes it, which is evidence
  # both that the diagnosis is right and that the package is unmaintained enough
  # to ship a broken install.
  #
  # mcp-gsheets is a better fit than the workaround anyway:
  #   - it has no Drive tools at all, so "cannot enumerate spreadsheets" is a
  #     property of the server rather than a list we maintain
  #   - GSHEETS_READ_ONLY is enforced at tools/call, not only at tools/list
  #   - every tool carries readOnlyHint / destructiveHint, so the allowlist below
  #     is derived the same way the Rapid7 one is, not chosen by reading names
  #   - 1.10.2 against 0.6.3, and it installs
  - name: google-sheets
    # Enabled after verification against a running instance on 2026-09-02:
    # tools/list returned exactly the 6 below, and sheets_update_values,
    # sheets_create_spreadsheet and sheets_format_cells were refused at
    # tools/call with "tool not found" rather than merely hidden. Authentication
    # was confirmed separately - sheets_check_access against a nonexistent ID
    # returned "Spreadsheet not found" rather than an auth error, which proves
    # the JWT exchange and both pinned egress hosts work.
    enabled: true
    protocol: "npx://mcp-gsheets@1.10.2"
    proxy_port: 19109
    transport: stdio
    purpose: read and update cell values in Google Sheets shared with the service account
    permissions: config/toolhive/google-permissions.json
    credentials: >
      toolhive environment secrets provider, GOOGLE_SERVICE_ACCOUNT_KEY. The
      service account JSON at runtime/google/service-account.json is passed as a
      single-line string by scripts/toolhive-up.sh. An env var rather than a
      mounted file for the same reason as AWS: ToolHive drives its own Docker
      socket, so a bind mount of a repository path may resolve to an empty
      directory.

    # Three layers:
    #   1. mcp-gsheets + GSHEETS_TOOLSETS=core — cell read/write tools only.
    #   2. ToolHive — explicit tool list; clear/format excluded; create allowed.
    #   3. Google — Viewer on sources = read; Editor on sources = in-place edits;
    #      new spreadsheets are created in the service account Drive (no ID allowlist).
    # Layer 3 is still the real boundary: Viewer shares stay read-only at Google;
    # Editor shares allow updates. ToolHive excludes create/clear/format tools.
    authorization_boundary: >
      The sharing level granted to
      research-curriculum-sync@gen-lang-client-0231900166.iam.gserviceaccount.com
      on each spreadsheet. Viewer = read-only at Google; Editor = updates allowed
      through the cell write tools below. New output workbooks may be created with
      sheets_create_spreadsheet (owned by the service account). No Drive listing.

    env:
      GSHEETS_READ_ONLY: "false"
      GSHEETS_TOOLSETS: core

    # Core read tools plus cell writers and new-spreadsheet creation. Clear,
    # formatting, charts, and row/column delete stay out via `excluded`.
    tools:
      - sheets_check_access
      - sheets_get_metadata
      - sheets_get_sheet_structure
      - sheets_get_sheet_dimensions
      - sheets_get_values
      - sheets_batch_get_values
      - sheets_update_values
      - sheets_batch_update_values
      - sheets_append_values
      - sheets_create_spreadsheet

    excluded:
      - sheets_clear_values

      # The other 33 tools - formatting, charts, tables, merges, row and column
      # insertion and deletion - are excluded by toolset rather than named here.
      # All of them write.
      #
      # Worth recording what is NOT in this server's surface, because it is the
      # reason no Drive allowlist is needed: there is no list-spreadsheets, no
      # Drive search, and no share-spreadsheet. The agent can open a spreadsheet
      # whose ID it was given and cannot discover or grant access to any other.
      # With the other candidate that property had to be configured; here it is
      # structural.

  # Phase 7. Still disabled, but no longer blocked on the unknown part.
  #
  # What was resolved on 2026-08-26: DBHub accepts an explicit database user,
  # which awslabs.mysql-mcp-server does not - every one of its auth paths
  # connects as master, which would have meant giving the agent the master
  # password. DBHub's aws_iam_auth goes further and removes passwords entirely,
  # generating a 15-minute RDS token for the named user, so nothing has to be
  # stored or rotated. See config/dbhub.toml.
  #
  # What remains is provisioning, not design: an Aurora MySQL cluster in alpha,
  # the nkb_agent_readonly user, and a network path to the reader endpoint.
  # Requested from Rajesh 2026-08-26; steps in provisioning/db/alpha.md.
  #
  # The hard boundary is the reader endpoint and the GRANTs, not this config.
  # ToolHive contributes tool admission and pinned egress only - which is worth
  # stating plainly, because for AWS the equivalent boundary was IAM and here
  # there is no AWS-side equivalent for the query itself.
  - name: dbhub
    # Enable only after tests/security/run-db-tests.sh passes against a live
    # cluster, including the ERROR 1290 check. A passing SELECT alone is not
    # sufficient evidence - that proves plumbing, not a boundary.
    enabled: false
    image: bytebase/dbhub
    proxy_port: 19108
    transport: stdio
    purpose: read-only SQL access for investigation
    blocked_on: alpha Aurora MySQL cluster - see provisioning/db/alpha.md
    config: config/dbhub.toml
    permissions: config/toolhive/db-permissions.json
    credentials: >
      none. aws_iam_auth generates an RDS token from the nkb-agent-alpha
      profile, so no database password exists to inject.
    # DBHub exposes a deliberately small surface - two tools - which is one
    # reason it suits this. Confirm the exact names against the pinned release
    # before enabling; ToolHive fails at startup on an unknown name, which is
    # the desired behaviour rather than something to work around.
    tools:
      - execute_sql
      - list_resources
    authorization_boundary: >
      Aurora reader endpoint (innodb_read_only) and the SELECT-only GRANTs on
      nkb_agent_readonly. DBHub's readonly flag and max_rows are guardrails
      above that, not the boundary.
