# Cross-repository system model for NKB.
#
# Generated from static source analysis on 2026-08-25. Evidence paths are relative
# to each repository root. Confidence is stated per claim; UNKNOWN is used rather
# than inference.
#
# THE ONE THING TO READ FIRST: these are not three network-separated services.
# nkb_backend is a composition root; the other two are pip packages installed into
# it. Every cross-repo call is an in-process Python import.

version: 1
generated_at: "2026-08-25"
method: static source reading only; no AWS, database, or network access

