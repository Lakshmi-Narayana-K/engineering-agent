structural_risks:
  - risk: app name collision on nkb_coach
    detail: "A top-level nkb_coach app exists in BOTH nkb_backend and nkb_learning_backend. nkb_backend registers its own; learning's APPS list omits it. Which wins on sys.path in the composed deployment is not determinable from source."
    evidence: "nkb_backend/nkb_backend/settings/base_swagger_utils.py:30; nkb_learning_backend/nkb_learning_backend/settings/base_swagger_utils.py:24-55"
  - risk: version pins disagree between files
    detail: "nkb_backend/pyproject.toml:39-40 pins nkb-learning-backend 5.40.11 / nkb_assessment_backend 5.31.4; nkb_backend/requirements_project.txt:44-45 pins 3.0.1 / 3.0.6. Same split exists in learning."
  - risk: undeclared cyclic dependency
    detail: "nkb_assessment_backend imports nkb_learning_backend apps without declaring the dependency. Failures surface at call time, not install time."
  - risk: committed credentials
    detail: "nkb_learning_backend/env_beta.sh is committed and contains live-looking credential VALUES (AWS keys, RDS password, Django SECRET_KEY, OpenAI token). .gitignore has an env_* rule, so it appears to predate it or was force-added. Reported as a finding; values were never read out, copied, or validated."

unknowns:
  - "Which installed distribution provides each of the ~35 third-party swagger apps not named in any pyproject.toml. Verifying requires reading .venv/site-packages, which was out of scope."
  - "Whether the legacy standalone deployments of the two library repos are still live, and whether they share the composed deployment's RDS instance."
  - "The transport behind ib_events @register subscriptions (EventBridge vs SNS+SQS vs in-process) - implemented inside the third-party ib_events package."
  - "The producer of the POSTER_GENERATED event; it is outside all three repos."
  - "How 80 of the 83 nkb_backend Lambda cron schedules are provisioned. zappa_settings.json has no events block and add_cron_job_events.py covers only 3 for one hardcoded stage."
  - "Whether production runs PostgreSQL or MySQL. RDS_DB_ENGINE is env-supplied and both drivers plus both CI harness scripts exist."
  - "Authoritative Python/Django runtime. Dockerfiles and zappa configs say Python 3.7; pyproject.toml files say ^3.12 with Django 5.1."
  - "Receivers for several assessment Django signals (end_exam_sender, the two Woolf signals) were not found in any of the three repos."
