  - nkb_backend
  - nkb_assessment_backend
  - nkb_learning_backend

topology:
  shape: single composed Django deployment plus two library packages
  confidence: HIGH
  composition_root: nkb_backend
  evidence:
    - "nkb_backend/zappa_settings.json:160-163 - sole owner of web_socket_handler, event_bridge_handler, sqs_handler, agentcore_gateway_handler"
    - "nkb_backend/pyproject.toml:39-40 - depends on nkb-learning-backend 5.40.11 and nkb_assessment_backend 5.31.4"
    - "nkb_learning_backend/env_beta.sh:1,11,51 - sets DJANGO_SETTINGS_MODULE=nkb_backend.settings.ccbp_beta and function=nkb-backend-ccbp-beta"
    - "nkb_assessment_backend/pytest.ini:5 - norecursedirs excludes nkb_learning_backend/settings, implying co-checkout"
  api_surface: >-
    nkb_backend/nkb_backend/urls.py:37-44 builds /api/<app_name>/ routes from
    INSTALLED_APPS, so its public HTTP surface is the union of all three repos' routes.
  caveat: >-
    Both library repos also ship their own zappa_settings.json for a legacy standalone
    deployment. Whether those are still live is UNKNOWN.

