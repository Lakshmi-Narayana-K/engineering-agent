    mechanism: in-process import; declared dependency
    caller_evidence: "nkb_learning_backend/nkb_resources/utils/get_content_data_util.py:42-48; nkb_niat/adapters/assessment_service_adapter.py:15"
    receiver_evidence: "nkb_assessment_backend/nkb_exam/interfaces/service_interface.py:197-208"
    declared_in: "nkb_learning_backend/pyproject.toml:63 - nkb_assessment_backend >=5.0.0,<6.0.0"
    notes: "Densest edge: roughly 20 adapter classes in learning wrap assessment ServiceInterfaces."
    confidence: HIGH

  - from: nkb_assessment_backend
    to: nkb_learning_backend
    mechanism: in-process import, lazy, UNDECLARED
    caller_evidence: "nkb_assessment_backend/nkb_coding_practice/adapters/coding_core_service_adapter.py:75; nkb_exam/adapters/learning_resource_service_adapter.py:19; nkb_question/adapters/learning_path_service/learning_path_service_adapter.py:7"
    receiver_evidence: "nkb_learning_backend/nkb_coding_core/, nkb_learning_resource/, nkb_learning_path/"
    notes: >-
      Not declared in nkb_assessment_backend/pyproject.toml. Imports are deferred inside
      @property and method bodies, so the package imports cleanly standalone but these
      paths only resolve when co-installed. This makes the runtime graph CYCLIC while
      the build-time graph stays acyclic.
    confidence: HIGH

  - from: [nkb_assessment_backend, nkb_learning_backend]
    to: nkb_backend
    mechanism: shared Django settings namespace (configuration ownership inversion)
    caller_evidence: "nkb_assessment_backend/nkb_question/adapters/compile_box_service_adapter_v3.py:162 reads settings.SQS_COMPILER_BOX_QUEUE_BASE_URL; nkb_learning_backend/nkb_auth_v2/sub_handlers/poster_generated_sub_handler.py:13 reads settings.IB_EVENTS_POSTER_GENERATED_SUBSCRIPTION"
    receiver_evidence: "nkb_backend/nkb_backend/settings/base.py:627-628; nkb_backend/nkb_backend/settings/base_server.py:121 - the only definitions"
    notes: "Neither setting exists in the library repos' own settings. Those code paths cannot run correctly outside the composed deployment."
    confidence: HIGH

  - from: nkb_assessment_backend
    to: nkb_backend
    mechanism: AWS SQS shared queue (the one genuinely asynchronous cross-repo edge)
    caller_evidence: "nkb_assessment_backend/nkb_question/adapters/compile_box_service_adapter_v3.py:91-94 publishes; nkb_question/utils/send_sqs_message_request.py:10-13"
    receiver_evidence: "nkb_backend/sqs_lambda_handler.py:19-26 consumes and dispatches back into assessment receivers; wired at nkb_backend/zappa_settings.json:162"
