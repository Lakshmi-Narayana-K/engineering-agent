# Things that look like cross-service edges and are NOT. Read this before
# concluding a network hop exists.
rejected_dependencies:
  - claim: "The get_service_adapter / interfaces/service_interface pattern is cross-service RPC"
    why_rejected: >-
      It is in-process. ServiceInterface methods are plain @staticmethods that directly
      instantiate the target app's StorageImplementation and interactor in the same
      Python process. No serialization, no transport, no base URL, no client. The
      adapter layer preserves clean-architecture boundaries between Django apps; it is
      architectural, not topological. These calls ARE cross-repository, but they are
      not cross-process.
    evidence: "nkb_assessment_backend/nkb_exam/interfaces/service_interface.py:197-208"

  - claim: "TOPIN_BASE_URL is an HTTP edge to nkb_assessment_backend"
    why_rejected: >-
      TOPIN is an unrelated external assessment product (topin.tech). Its path prefix
      /api/nw_integrations has zero matches anywhere in nkb_assessment_backend, whose
      own hostnames are nkb-assessment-backend-*.apigateway.in.
    evidence: "nkb_backend/nkb_backend/settings/ccbp_prod.py:679,565; consumed only at nkb_learning_backend/nkb_placement_support/adapters/topin_adapter.py:53"

  - claim: "There is a REST/HTTP edge between any two of the three repos"
    why_rejected: >-
      No repo constructs a URL targeting another. Every /api/nkb_*/ literal is the
      repo's own basePath or its own view tests. Every requests.* call site targets an
      external system (Azure OpenAI, Google Speech, BigQuery, CompilerBox, Codeforces).
    evidence: "Searched /api/nkb_[a-z_]+/ across all three repos - self-references only"

  - claim: "nkb_leaderboard links assessment to learning"
    why_rejected: "nkb_leaderboard is owned solely by nkb_assessment_backend. ib_leaderboard, nw_leaderboard and nw_activities are separate external pip packages."
    evidence: "nkb_assessment_backend/nkb_assessment_backend/settings/base_swagger_utils.py:27,22"

  - claim: "IB_EVENTS_* subscriptions are events exchanged between these three repos"
    why_rejected: "Subscription constants are named after external producers (payments/NACH, ib_user_accounts, TOPIN, job readiness, poster generation). No subscription name in one repo matches an emit_event event_type in a sibling."
    evidence: "nkb_backend/nkb_backend/settings/base_server.py:109-158"

  - claim: "nkb_resources_extensions/sub_handlers/mark_unit_as_completed_handler.py consumes assessment results"
    why_rejected: "It registers on IB_EVENTS_UPDATE_USER_AI_INTERVIEW_STATUS_SUBSCRIPTION - an AI-interview subscription, not an assessment one."
    evidence: "nkb_learning_backend/nkb_resources_extensions/sub_handlers/mark_unit_as_completed_handler.py:14"

